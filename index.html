<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de edad</title>

    <!-- da la apariencia del calendario (flatpickr) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="tarjeta">
        <h1>Calculadora de edad</h1>

        <form id="formulario">
            <label for="fecha">Ingresa tu fecha de nacimiento:</label>
            <input type="text" id="fecha" placeholder="dd/mm/aaaa" autocomplete="off">
            <button type="submit">Calcular</button>
        </form>

        <!-- aquí se muestra la edad o el error -->
        <p id="resultado"></p>
    </main>

    <!-- flatpickr calendario y el idioma en español -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/es.js"></script>
    <!-- luxon cálculo de fechas -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>

    <script src="script.js"></script>
</body>

</html>
