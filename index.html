<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de edad</title>

    <!-- estilos del calendario (flatpickr) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <!-- mis estilos -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="tarjeta">
        <h1>Calculadora de edad</h1>

        <!-- formulario donde se pone la fecha -->
        <form id="formulario">
            <label for="fecha">Ingresa tu fecha de nacimiento:</label>
            <input type="text" id="fecha" placeholder="dd/mm/aaaa" autocomplete="off">
            <button type="submit">Calcular</button>
        </form>

        <!-- aquí se muestra la edad o el error -->
        <p id="resultado"></p>
    </main>
